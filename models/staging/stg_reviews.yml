version: 2

models:
  - name: stg_reviews
    description: "Staging model for reviews with score and timestamp casting."
    columns:
      - name: review_id
        tests:
          - not_null

      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: review_score
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]