name: dbt-ci

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  dbt-validate:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: ./.dbt_ci

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-snowflake

      - name: Create CI profiles.yml
        run: |
          mkdir -p .dbt_ci
          cat > .dbt_ci/profiles.yml << 'EOF'
          dbt_project:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: ${{ secrets.SNOWFLAKE_SCHEMA }}
                threads: 4
                client_session_keep_alive: false
          EOF

      - name: dbt debug
        working-directory: .
        run: dbt debug

      - name: dbt parsee
        working-directory: .
        run: dbt parse

      - name: dbt build
        working-directory: .
        run: dbt build --select staging intermediate marts

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"❌ dbt CI failed in repo ${{ github.repository }} on branch ${{ github.ref_name }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}